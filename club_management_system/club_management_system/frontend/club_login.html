
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Club Member Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Club Member Login</h2>
      <form action="../backend/login.php" method="post">
        <input type="hidden" name="role" value="club_member" />
        <label for="username">Club Member Name</label>
        <input type="text" name="username" placeholder="Enter Club Member Name" required />
        <label for="password">Password</label>
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <br />
      <a class="button" href="index.html">← Back to Home</a>
    </div>
  </div>
</body>
</html>
