<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Request Event Approval</title>
  <link rel="stylesheet" href="../frontend/style.css">
</head>
<body>
  <div class="container">
    <h2>Request Event Approval</h2>
    <form action="../backend/club_event_request.php" method="POST" enctype="multipart/form-data">
      <input type="text" name="wname" placeholder="Event Name" required>
      <input type="date" name="wdate" required>
      <input type="time" name="wtime" required>
      <input type="text" name="venue" placeholder="Venue" required>
      <textarea name="resources" placeholder="Resources Required (e.g., mic, projector)" required></textarea>
      <textarea name="wdesc" placeholder="Event Description" required></textarea>
      <label>Upload Image:</label>
      <input type="file" name="image" accept="image/*">
      <label>Upload Video:</label>
      <input type="file" name="video" accept="video/*">
      <button type="submit">Submit Request</button>
    </form>
    <a class="button" href="../frontend/club_member_dashboard.html">Back to Dashboard</a>
  </div>
</body>
</html>
