<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Club Member Signup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Club Member Signup</h2>
    <form action="../backend/club_signup.php" method="POST">
      <input type="text" name="cname" placeholder="Full Name" required />
<input type="text" name="usnc" placeholder="USN" required />
<input type="email" name="email" placeholder="Email" required />
<input type="text" name="dance_style" placeholder="Dance Style" required />
<input type="password" name="password" placeholder="Password" required />
<input type="password" name="confirm_password" placeholder="Confirm Password" required />

      <button type="submit">Submit</button>
    </form>
    <a class="button" href="index.html">Back to Home</a>
  </div>
</body>
</html>
